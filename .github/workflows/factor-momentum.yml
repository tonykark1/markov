name: factor-momentum

on:
  push:
    branches:
      - factor-momentum-test
  pull_request:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . openassetpricing
      - name: Download broad non-momentum factor panel
        run: >-
          python scripts/download_openap_factor_panel.py
          --output data/openap_nonmomentum_factors.csv
          --metadata data/openap_nonmomentum_factor_metadata.csv
          --min-months 120
          --release 202410
      - name: Run paper-style factor momentum tests
        run: >-
          python scripts/run_factor_momentum_panel.py
          data/openap_nonmomentum_factors.csv
          --output results/factor_momentum_broad
      - name: Run out-of-sample PCA factor momentum tests
        run: >-
          python scripts/run_pca_factor_momentum.py
          data/openap_nonmomentum_factors.csv
          --output results/pca_factor_momentum
          --signal-lookback 12
          --refit-every 12
      - uses: actions/upload-artifact@v4
        with:
          name: factor-momentum-broad-results
          path: |
            results/factor_momentum_broad/
            results/pca_factor_momentum/
            data/openap_nonmomentum_factor_metadata.csv
