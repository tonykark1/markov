name: factor-momentum

on:
  push:
    branches:
      - factor-momentum-test
  pull_request:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download pinned OpenAP long-short return mirror
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/YipengZou/UnifArb/713726e26366aa1b40855cbf3e2efaa1a8c64d5c/metadata/PredictorLSretWide.csv
          --output data/PredictorLSretWide.csv
      - name: Prepare pinned factor universe
        run: >-
          python scripts/prepare_openap_wide_panel.py
          data/PredictorLSretWide.csv
          data/factor_momentum_universe.txt
          --output data/openap_nonmomentum_factors.csv
          --min-months 120
      - name: Run paper-style factor momentum tests
        run: >-
          python scripts/run_factor_momentum_panel.py
          data/openap_nonmomentum_factors.csv
          --output results/factor_momentum_broad
      - name: Run out-of-sample PCA factor momentum tests
        run: >-
          python scripts/run_pca_factor_momentum.py
          data/openap_nonmomentum_factors.csv
          --output results/pca_factor_momentum
          --signal-lookback 12
          --refit-every 12
      - uses: actions/upload-artifact@v4
        with:
          name: factor-momentum-pca-results
          path: |
            results/factor_momentum_broad/
            results/pca_factor_momentum/
            data/openap_nonmomentum_factors.csv
            data/factor_momentum_universe.txt
